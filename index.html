<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My World</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: url('2.png') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-shadow: 1px 1px 2px #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .lock-screen {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .lock-box {
      background: rgba(255,255,255,0.1);
      padding: 30px;
      border-radius: 15px;
      text-align: center;
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-top: 10px;
      text-align: center;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #ff6f91;
      color: white;
      cursor: pointer;
    }

    .container {
      display: none;
      z-index: 2;
      text-align: center;
      background-color: rgba(0, 0, 0, 0.4);
      padding: 30px;
      border-radius: 20px;
    }

    .birds {
      position: absolute;
      width: 180px;
      animation: flyDiagonal 15s linear infinite;
    }

    @keyframes flyDiagonal {
      0% { top: -100px; right: -100px; opacity: 0.2; }
      50% { top: 40%; right: 40%; opacity: 1; }
      100% { top: 90%; right: 70%; opacity: 0; }
    }

    .links-tab {
      display: none;
      flex-direction: column;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="lock-screen" id="lock">
  <div class="lock-box">
    <h2>120823</h2>
    <input type="password" id="p">
    <br>
    <button onclick="c()">Unlock</button>
    <p id="e" style="color:red;"></p>
  </div>
</div>

<img src="3.gif" class="birds">

<div class="container" id="main">
  <h1>Welcome to My World</h1>
  <p>A site about me, my interests, and how to reach me.</p>

  <img src="1.png" class="icon" onclick="t()" style="width:120px;border-radius:50%;cursor:pointer;">

  <div id="links" class="links-tab">
    <a href="about.html">About Me</a>
    <a href="blog.html">Hobbies and Achievements</a>
    <a href="contact.html">Contact</a>
  </div>
</div>

<script>
  function t(){
    let x=document.getElementById("links");
    x.style.display = x.style.display==="flex"?"none":"flex";
  }

  // 🔐 Encoded passcode (base64 of 123456)
  const k = "MTIzNDU2";

  function c(){
    let v = document.getElementById("p").value;

    // decode hidden passcode
    let real = atob(k);

    if(v === real){
      document.getElementById("lock").style.display="none";
      document.getElementById("main").style.display="block";
    } else {
      document.getElementById("e").innerText="Wrong passcode";
    }
  }
</script>

</body>
</html>
